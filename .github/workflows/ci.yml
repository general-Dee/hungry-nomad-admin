name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # check-env.js (prebuild) only checks these are *present*, not valid --
      # no page hits Supabase/Resend at build time, so placeholders are safe.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
      RESEND_API_KEY: placeholder-resend-key
      RESEND_FROM_EMAIL: admin@example.com
      RESEND_WEBHOOK_SECRET: placeholder-webhook-secret
      TERMII_API_KEY: placeholder-termii-api-key
      TERMII_SENDER_ID: placeholder-sender-id
      STAFF_NOTIFICATION_PHONE_NUMBERS: "+2348011112222"
      ORDER_SMS_WEBHOOK_SECRET: placeholder-order-sms-webhook-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
